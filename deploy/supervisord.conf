; =====================================================================
; Supervisión de procesos de HailCast (contenedor CPU de producción)
; Cada programa se reinicia solo si muere. Antes, el PID 1 era `tail -f`
; y un worker caído dejaba el contenedor "up" sin que nadie se enterara.
; Los logs rotan (20 MB x 5) para no llenar el disco en campaña.
; =====================================================================

[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; --- Pipeline de inferencia (MDV -> NC -> modelo -> PNG) ---
[program:worker]
command=python3 -m worker.main
directory=/app
environment=PYTHONPATH="/app/backend"
autostart=true
autorestart=true
startsecs=10
startretries=1000
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/app/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
priority=10

; --- API Flask (gunicorn) ---
[program:api]
command=gunicorn --chdir /app/backend -w 1 --threads 8 --timeout 120 -b 0.0.0.0:8000 api.main:app
directory=/app
environment=PYTHONPATH="/app/backend"
autostart=true
autorestart=true
startsecs=5
startretries=1000
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=/app/logs/api.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
priority=20

; --- Drive Watcher (rclone). Sale con 0 si RCLONE_REMOTE_BASE no está seteada. ---
[program:watcher]
command=/app/deploy/run_watcher.sh
directory=/app
autostart=true
autorestart=unexpected
exitcodes=0
; startsecs=0: si sale con 0 de inmediato (deshabilitado) cuenta como salida normal, no como fallo de arranque
startsecs=0
startretries=1000
redirect_stderr=true
stdout_logfile=/app/logs/watcher.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
priority=30

; --- Watchdog: reinicia el worker si status.json se queda viejo y avisa por Telegram ---
[program:watchdog]
command=/app/deploy/watchdog.sh
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=1000
redirect_stderr=true
stdout_logfile=/app/logs/watchdog.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=40

; --- Frontend local (opcional: el de producción está en Vercel). ENABLE_LOCAL_FRONTEND=1 para activarlo. ---
[program:frontend]
command=/app/deploy/run_frontend.sh
directory=/app/frontend
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
redirect_stderr=true
stdout_logfile=/app/logs/frontend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
priority=50
